# ──────────────────────────────────────────────────────────────────────
# vigil 控制台站点 —— 主页面（实时态势）与管理页面（后台控制台）
#
# 这是一份**模板**：deploy/install.sh 读 config.json（public_host /
# webroot）后把 __PUBLIC_HOST__ / __WEBROOT__ / __SITES_DIR__ 替换掉，
# 渲染到
#   /www/server/panel/vhost/nginx/__PUBLIC_HOST__.conf
# 直接 install 这个文件不会报错，但 vhost 会指向不存在的目录、证书和
# server_name 也是占位符 —— 请走 install.sh。
#
# 页面本身由 nginx 直接静态提供；只有 /api/ 走 127.0.0.1:9310 的
# Python 服务。SSE（/api/v1/stream）单独关闭缓冲并放宽超时，否则
# 反代会把实时事件攒成一批再发。
# ──────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen 443 ssl http2;
    server_name __PUBLIC_HOST__;

    index index.html;
    root __WEBROOT__;

    access_log /www/wwwlogs/vigil-access.log;
    error_log /www/wwwlogs/vigil-error.log;

    # 站点开关：管理页可以把本控制台自己的站点也一键关掉
    include __SITES_DIR__/*.conf;

    # vigil 自己的即时封禁名单：控制台也吃同一份决定
    include /www/server/panel/vhost/nginx/extension/__PUBLIC_HOST__/vigil-deny.conf;

    # 宝塔申请证书时的文件校验目录，请勿删除
    include /www/server/panel/vhost/nginx/well-known/__PUBLIC_HOST__.conf;

    # 扫描器 UA 拦截（vigil shield，http 段定义）
    if ($dsh_bad_agent) { return 403; }

    # HTTP 跳 HTTPS，但放行证书校验
    set $isRedcert 1;
    if ($server_port != 443) { set $isRedcert 2; }
    if ($uri ~ /\.well-known/) { set $isRedcert 1; }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }

    ssl_certificate     /www/server/panel/vhost/cert/__PUBLIC_HOST__/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/__PUBLIC_HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    error_page 497 https://$host$request_uri;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    # The default is `off`, which is why the JSON API was being sent
    # uncompressed even though gzip was enabled: every API response here is
    # proxied, so without this line the biggest payloads on the site were the
    # only ones not being compressed.
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # ── 页面 ───────────────────────────────────────────────────────
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }
    location = /admin.html {
        try_files /admin.html =404;
        add_header Cache-Control "no-store";
    }
    # Hashed asset names may be cached forever: a change to the file changes
    # the URL, so a stale copy can never be served. Anything without a hash
    # (world.json, which the page fetches by a fixed path) gets a short cache
    # instead, because its name cannot tell the browser it changed.
    # Note: no {n} quantifier. nginx parses an unquoted brace in a location
    # regex as the start of a block, which fails the config with a confusing
    # "unknown directive" on the pattern itself.
    location ~ ^/assets/[^/]+\.[0-9a-f]+\.(css|js|mjs|svg|png|webp|woff2?)$ {
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /assets/world.json {
        gzip_static on;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }
    location /assets/ {
        gzip_static on;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store";
    }

    # ── 实时事件流（SSE）───────────────────────────────────────────
    location = /api/v1/stream {
        proxy_pass http://127.0.0.1:9310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
        access_log off;
    }

    # ── 其余接口 ───────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:9310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        # 会话 Cookie 在服务端不带 Secure（回环是明文），由这里补上
        proxy_cookie_flags vigil_session secure httponly samesite=strict;
    }

    location = /favicon.ico { try_files /assets/favicon.svg =404; access_log off; }

    location ~ /\.(?!well-known) { deny all; }
}
