<svg xmlns="http://www.w3.org/2000/svg" width="734" height="392" viewBox="0 0 734 392" font-family="-apple-system,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
<rect width="734" height="392" fill="#0e1621"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8ba0b8"/></marker></defs>
<text x="32" y="40" fill="#dbe6f2" font-size="17" font-weight="650">vigil 架构与数据流</text>
<text x="32" y="60" fill="#8ba0b8" font-size="11">一台机器上，从观测到处置再到自我改进的完整链路</text>
<rect x="32" y="84" width="190" height="62" rx="10" fill="#18222f" stroke="#243244"/>
<text x="46" y="108" fill="#6fa8d6" font-size="13" font-weight="650">流量与日志</text>
<text x="46" y="126" fill="#8ba0b8" font-size="10">nginx / auth / panel / 诱饵</text>
<rect x="32" y="164" width="190" height="62" rx="10" fill="#18222f" stroke="#243244"/>
<text x="46" y="188" fill="#6fa8d6" font-size="13" font-weight="650">观测入口</text>
<text x="46" y="206" fill="#8ba0b8" font-size="10">逐行解析，只读</text>
<rect x="262" y="84" width="200" height="62" rx="10" fill="#18222f" stroke="#243244"/>
<text x="276" y="108" fill="#4caf7d" font-size="13" font-weight="650">判定器</text>
<text x="276" y="126" fill="#8ba0b8" font-size="10">诱饵 · 特征 · 速率 · 审计</text>
<rect x="262" y="164" width="200" height="62" rx="10" fill="#18222f" stroke="#243244"/>
<text x="276" y="188" fill="#d9a441" font-size="13" font-weight="650">封禁执行</text>
<text x="276" y="206" fill="#8ba0b8" font-size="10">ipset / iptables / nginx</text>
<rect x="502" y="84" width="200" height="62" rx="10" fill="#18222f" stroke="#243244"/>
<text x="516" y="108" fill="#4caf7d" font-size="13" font-weight="650">告警通道</text>
<text x="516" y="126" fill="#8ba0b8" font-size="10">邮件（改前 / 事后 / 熔断）</text>
<rect x="502" y="164" width="200" height="62" rx="10" fill="#18222f" stroke="#243244"/>
<text x="516" y="188" fill="#6fa8d6" font-size="13" font-weight="650">只增台账</text>
<text x="516" y="206" fill="#8ba0b8" font-size="10">每次改动可逐条回滚</text>
<rect x="32" y="262" width="190" height="62" rx="10" fill="#18222f" stroke="#243244"/>
<text x="46" y="286" fill="#4caf7d" font-size="13" font-weight="650">自监督训练</text>
<text x="46" y="304" fill="#8ba0b8" font-size="10">标签来自已发生的处置</text>
<rect x="262" y="262" width="200" height="62" rx="10" fill="#18222f" stroke="#243244"/>
<text x="276" y="286" fill="#6fa8d6" font-size="13" font-weight="650">自修正循环</text>
<text x="276" y="304" fill="#8ba0b8" font-size="10">有边界 · 证据门槛</text>
<rect x="502" y="262" width="200" height="62" rx="10" fill="#18222f" stroke="#243244"/>
<text x="516" y="286" fill="#d9a441" font-size="13" font-weight="650">监控进程</text>
<text x="516" y="304" fill="#8ba0b8" font-size="10">从外部看它有没有失控</text>
<line x1="222" y1="115" x2="262" y2="115" stroke="#8ba0b8" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="222" y1="195" x2="262" y2="195" stroke="#8ba0b8" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="462" y1="115" x2="502" y2="115" stroke="#8ba0b8" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="462" y1="195" x2="502" y2="195" stroke="#8ba0b8" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="127" y1="146" x2="127" y2="262" stroke="#8ba0b8" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="362" y1="226" x2="362" y2="262" stroke="#8ba0b8" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="602" y1="226" x2="602" y2="262" stroke="#8ba0b8" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="462" y1="293" x2="502" y2="293" stroke="#8ba0b8" stroke-width="1.4" marker-end="url(#a)"/>
<text x="32" y="368" fill="#8ba0b8" font-size="10">所有宿主机信息（主机名、域名、路径）在运行时获取；源码与随包文件里不含任何一台机器。</text>
</svg>
