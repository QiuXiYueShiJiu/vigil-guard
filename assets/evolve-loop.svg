<svg xmlns="http://www.w3.org/2000/svg" width="760" height="474" viewBox="0 0 760 474" font-family="-apple-system,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
<rect width="760" height="474" fill="#0e1621"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6fa8d6"/></marker></defs>
<text x="28" y="36" fill="#dbe6f2" font-size="16" font-weight="650">自修正闭环：它凭什么被允许改自己</text>
<rect x="28" y="60" width="520" height="46" rx="10" fill="#18222f" stroke="#243244"/>
<text x="42" y="84" fill="#6fa8d6" font-size="13" font-weight="650">① 观测</text>
<text x="42" y="102" fill="#8ba0b8" font-size="10">读本机真实流量</text>
<rect x="28" y="114" width="520" height="46" rx="10" fill="#18222f" stroke="#243244"/>
<text x="42" y="138" fill="#6fa8d6" font-size="13" font-weight="650">② 自监督标签</text>
<text x="42" y="156" fill="#8ba0b8" font-size="10">命中诱饵 / 随后被封禁 → 正；被正常服务 → 负</text>
<rect x="28" y="168" width="520" height="46" rx="10" fill="#18222f" stroke="#243244"/>
<text x="42" y="192" fill="#6fa8d6" font-size="13" font-weight="650">③ 训练</text>
<text x="42" y="210" fill="#8ba0b8" font-size="10">在线逻辑回归，每一票可读回特征名与权重</text>
<rect x="28" y="222" width="520" height="46" rx="10" fill="#18222f" stroke="#243244"/>
<text x="42" y="246" fill="#6fa8d6" font-size="13" font-weight="650">④ 提案</text>
<text x="42" y="264" fill="#8ba0b8" font-size="10">≥8 次命中且 ≥3 个独立来源；路径过严格文法</text>
<rect x="28" y="276" width="520" height="46" rx="10" fill="#18222f" stroke="#243244"/>
<text x="42" y="300" fill="#6fa8d6" font-size="13" font-weight="650">⑤ 邮件先行</text>
<text x="42" y="318" fill="#8ba0b8" font-size="10">改哪个文件、依据、怎么回滚 —— 先发出去</text>
<rect x="28" y="330" width="520" height="46" rx="10" fill="#18222f" stroke="#243244"/>
<text x="42" y="354" fill="#6fa8d6" font-size="13" font-weight="650">⑥ 应用</text>
<text x="42" y="372" fill="#8ba0b8" font-size="10">行为数据自动；源码改动默认关闭，过测试才留</text>
<rect x="28" y="384" width="520" height="46" rx="10" fill="#18222f" stroke="#243244"/>
<text x="42" y="408" fill="#6fa8d6" font-size="13" font-weight="650">⑦ 回看</text>
<text x="42" y="426" fill="#8ba0b8" font-size="10">宽限期内从未命中的诱饵，主动撤下</text>
<line x1="288" y1="430" x2="288" y2="66" stroke="#6fa8d6" stroke-width="1.4" marker-end="url(#a)"/>
<text x="560" y="150" fill="#4caf7d" font-size="10">改前发邮件</text>
<text x="560" y="170" fill="#4caf7d" font-size="10">改后写台账 + 上报</text>
<text x="560" y="190" fill="#d9a441" font-size="10">关键文件禁碰（第二道锁）</text>
<text x="560" y="210" fill="#d9a441" font-size="10">资源按可用量取比例</text>
<text x="560" y="230" fill="#d9a441" font-size="10">单次时限 120 秒</text>
<text x="560" y="250" fill="#d9a441" font-size="10">负载高就不开工</text>
<text x="28" y="456" fill="#8ba0b8" font-size="10">泛化验证：整族未见过的攻击与正常路径对照组一起评，报区分度与误报数。</text>
</svg>
