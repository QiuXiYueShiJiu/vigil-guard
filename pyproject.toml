[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vigil-guard"
version = "1.0.4"
description = "Server security, integrity and alerting guard"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
# No runtime dependencies, on purpose: the tool must install on a bare
# server with nothing but a system Python. Everything is standard library.
dependencies = []
keywords = ["security", "monitoring", "alerting", "intrusion-detection",
            "server", "sysadmin", "auditd", "fail2ban"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/vigil-guard/vigil"
Documentation = "https://github.com/vigil-guard/vigil/tree/main/docs"
Issues = "https://github.com/vigil-guard/vigil/issues"

[project.scripts]
vigil = "vigil.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vigil = ["gates/templates/*.tmpl"]
